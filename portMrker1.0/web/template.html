<style>
  /* Deliberately single-theme: the app is designed dark (slate-950 ground). */
  :root {
    --pm-bg: #020617;
    --pm-fg: #f1f5f9;
    --pm-muted: #94a3b8;
    --pm-accent: #f59e0b;
    --pm-danger: #fda4af;
    color-scheme: dark;
    background: var(--pm-bg);
  }
  body {
    background: var(--pm-bg);
    color: var(--pm-fg);
    font-family: 'Inter', 'Noto Sans Lao', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #pm-boot {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 16px;
    text-align: center;
    color: var(--pm-muted);
    font-size: 14px;
  }
  #pm-boot .pm-logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f59e0b, #059669);
    animation: pm-pulse 1.4s ease-in-out infinite;
  }
  #pm-boot strong { color: var(--pm-fg); font-size: 18px; }
  #pm-boot pre {
    max-width: 100%;
    overflow-x: auto;
    text-align: left;
    color: var(--pm-danger);
    font-size: 12px;
    white-space: pre-wrap;
  }
  @keyframes pm-pulse { 50% { opacity: .55; transform: scale(.94); } }
  @media (prefers-reduced-motion: reduce) { #pm-boot .pm-logo { animation: none; } }
  /* Keep the fixed mobile bottom bar clear of the phone's home indicator */
  nav.fixed.bottom-0 { padding-bottom: calc(0.375rem + env(safe-area-inset-bottom, 0px)); }
</style>

<script>
/* Startup checks + the module map the prebuilt bundle's require() calls resolve to. */
(function () {
  function showError(err) {
    console.error(err);
    var boot = document.getElementById('pm-boot');
    if (!boot) {
      boot = document.createElement('div');
      boot.id = 'pm-boot';
      document.body.appendChild(boot);
    }
    boot.innerHTML = '<strong>portMrker</strong><span>ເປີດແອັບບໍ່ສຳເລັດ / เปิดแอปไม่สำเร็จ / The app could not start</span><pre></pre>';
    // Safari's stack has no message, so print name + message explicitly, then the environment
    var text = err && err.message !== undefined
      ? (err.name || 'Error') + ': ' + err.message + '\n' + (err.stack || '')
      : String(err);
    text += '\n\n' + navigator.userAgent + '\nlocation: ' + location.protocol + '//' + location.host;
    boot.querySelector('pre').textContent = text;
  }
  window.__pmShowError = showError;
  window.addEventListener('error', function (e) {
    if (document.getElementById('pm-boot')) showError(e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (document.getElementById('pm-boot')) showError(e.reason);
  });

  var missing = ['React', 'ReactDOM', 'LucideReact', 'Recharts'].filter(function (g) { return !window[g]; });
  if (missing.length) {
    showError('Libraries failed to load: ' + missing.join(', ') + ' — check the internet connection and reload.');
    return;
  }

  var R = window.React;
  function jsx(type, props, key) {
    return R.createElement(type, key === undefined ? props : Object.assign({}, props, { key: key }));
  }
  var modules = {
    'react': R,
    'react-dom': window.ReactDOM,
    'react-dom/client': window.ReactDOM,
    'react/jsx-runtime': { jsx: jsx, jsxs: jsx, Fragment: R.Fragment },
    'lucide-react': window.LucideReact,
    'recharts': window.Recharts,
  };
  window.require = function (name) {
    if (Object.prototype.hasOwnProperty.call(modules, name)) return modules[name];
    throw new Error('Unknown module: ' + name);
  };
})();
</script>
